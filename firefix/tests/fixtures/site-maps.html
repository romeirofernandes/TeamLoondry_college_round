<!doctype html><meta charset="utf-8"><title>Handsfree maps demo</title><style>body{font:18px system-ui;margin:24px}button,input,textarea,select{font:inherit;margin:8px;padding:12px}aside,main,app-train-search,app-train-list,[role="dialog"]{display:block;padding:16px}a,[role="row"]{display:block;margin:8px;padding:12px}[contenteditable]{min-height:80px;border:1px solid;padding:12px}[data-map-zoom]{width:300px;height:160px;background:#eee}</style><main role="main"><h1>Bengaluru Palace</h1><button data-item-id="address">Vasanth Nagar, Bengaluru</button><button data-item-id="oh">Open 10 AM to 5 PM</button><a class="hfpxzc" aria-label="Bengaluru Palace" href="/maps/place/Palace">Bengaluru Palace</a><div id="directions-searchbox-0"><input value="Bengaluru Palace"></div><div id="directions-searchbox-1"><input value="Bengaluru airport"></div><button role="radio" aria-checked="true">Driving</button><button role="radio" aria-checked="false">Walking</button><button aria-label="Zoom in">+</button><div aria-label="Map" data-map-zoom="10"></div><div data-trip-index="0" aria-selected="false">Driving, 50 minutes</div></main><script>
 window.writes=0;
 for(const row of document.querySelectorAll('#pane-side [role="row"]'))row.onclick=()=>{document.querySelector('#main header span').textContent=row.textContent;};
 for(const button of document.querySelectorAll('button[aria-pressed],button[aria-checked]'))button.onclick=()=>{const attr=button.hasAttribute('aria-pressed')?'aria-pressed':'aria-checked';const state=button.getAttribute(attr)!=='true';button.setAttribute(attr,String(state));if(button.getAttribute('aria-label')==='Save'||button.getAttribute('aria-label')==='Saved')button.setAttribute('aria-label',state?'Saved':'Save');if(button.getAttribute('role')==='radio'){for(const other of document.querySelectorAll('[role=radio]'))if(other!==button)other.setAttribute('aria-checked','false');document.querySelector('[data-trip-index]').textContent='Walking, 4 hours';}};
 for(const button of document.querySelectorAll('button')){
 const name=button.getAttribute('aria-label')||button.textContent;
 if(name==='Send')button.onclick=()=>{window.writes++;const root=button.closest('footer,[role="dialog"],[data-panel-id="chat"]');const editor=root.querySelector('textarea,[contenteditable]');const text=editor.value??editor.textContent;const message=document.createElement('div');if(location.hostname==='mail.google.com'){message.setAttribute('role','alert');message.textContent='Message sent';document.body.append(message);}else if(location.hostname==='web.whatsapp.com'){message.className='message-out';message.textContent=text;document.querySelector('#main [role="log"]').append(message);}else{message.dataset.messageId='self-'+window.writes;message.textContent=text;root.append(message);}if('value' in editor)editor.value='';else editor.textContent='';};
 if(name==='Search')button.onclick=()=>{document.querySelector('app-train-list').innerHTML='<div data-journey-summary>MAS SBC 18/11/2026</div><article data-train-number="12627">Train 12627</article>';};
 if(name==='Join now')button.onclick=()=>{button.textContent='Leave call';};
 if(name.startsWith('Turn ')||name==='Raise hand'||name==='Lower hand')button.onclick=()=>{button.setAttribute('aria-label',name.startsWith('Turn off ')?name.replace('Turn off ','Turn on '):name.startsWith('Turn on ')?name.replace('Turn on ','Turn off '):name==='Raise hand'?'Lower hand':'Raise hand');};
 if(name==='Zoom in')button.onclick=()=>document.querySelector('[data-map-zoom]').dataset.mapZoom='11';
 }
 </script>
