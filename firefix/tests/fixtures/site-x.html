<!doctype html><meta charset="utf-8"><title>Handsfree x demo</title><style>body{font:18px system-ui;padding:24px}button,input,textarea,select{font:inherit;padding:12px;margin:8px}h2,section{margin-top:60px}article,shreddit-post{display:block;padding:20px;border:1px solid #ddd}a{display:inline-block;padding:6px}</style><main><article data-testid="tweet"><div data-testid="tweetText">First test post</div><a href="/demo/status/111">Details</a><button aria-label="Like" aria-pressed="false">Like</button></article><article data-testid="tweet"><div data-testid="tweetText">Second test post</div><a href="/demo/status/222">Details</a><button aria-label="Like" aria-pressed="false">Like</button></article></main><script>
 for(const button of document.querySelectorAll('button[aria-pressed]'))button.addEventListener('click',()=>{button.dataset.clicks=String(Number(button.dataset.clicks||0)+1);button.setAttribute('aria-pressed',String(button.getAttribute('aria-pressed')!=='true'));});
 const publish=[...document.querySelectorAll('button')].find(b=>b.textContent==='Create issue');
 if(publish)publish.addEventListener('click',()=>{const node=document.createElement('h2');node.dataset.testid='issue-title';node.textContent=document.querySelector('input').value;document.querySelector('main').append(node);});
</script>
