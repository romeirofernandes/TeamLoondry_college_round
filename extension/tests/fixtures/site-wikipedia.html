<!doctype html><meta charset="utf-8"><title>Handsfree wikipedia demo</title><style>body{font:18px system-ui;padding:24px}button,input,textarea,select{font:inherit;padding:12px;margin:8px}h2,section{margin-top:60px}article,shreddit-post{display:block;padding:20px;border:1px solid #ddd}a{display:inline-block;padding:6px}</style><h1 id="firstHeading">India</h1><main id="mw-content-text"><div class="mw-parser-output"><h2 id="History">History</h2><h2 id="Geography">Geography</h2><p>Climate description <a href="/wiki/Earth">Earth</a></p></div><ol class="references"><li id="cite1">Reference</li></ol></main><script>
 for(const button of document.querySelectorAll('button[aria-pressed]'))button.addEventListener('click',()=>{button.dataset.clicks=String(Number(button.dataset.clicks||0)+1);button.setAttribute('aria-pressed',String(button.getAttribute('aria-pressed')!=='true'));});
 const publish=[...document.querySelectorAll('button')].find(b=>b.textContent==='Create issue');
 if(publish)publish.addEventListener('click',()=>{const node=document.createElement('h2');node.dataset.testid='issue-title';node.textContent=document.querySelector('input').value;document.querySelector('main').append(node);});
</script>
