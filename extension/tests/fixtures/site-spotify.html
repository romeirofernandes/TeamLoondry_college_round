<!doctype html><meta charset="utf-8"><title>Handsfree spotify demo</title><style>body{font:18px system-ui;padding:24px}button,input,textarea,select{font:inherit;padding:12px;margin:8px}h2,section{margin-top:60px}article,shreddit-post{display:block;padding:20px;border:1px solid #ddd}a{display:inline-block;padding:6px}</style><main><div data-testid="tracklist-row"><a href="/track/123" data-testid="track-name">Creep</a><span>Radiohead</span></div></main><div data-testid="now-playing-widget"><a data-testid="context-item-link" href="/track/123">Creep by Radiohead</a><button aria-label="Add to Liked Songs" aria-pressed="false">Save</button></div><script>
 for(const button of document.querySelectorAll('button[aria-pressed]'))button.addEventListener('click',()=>{button.dataset.clicks=String(Number(button.dataset.clicks||0)+1);button.setAttribute('aria-pressed',String(button.getAttribute('aria-pressed')!=='true'));});
 const publish=[...document.querySelectorAll('button')].find(b=>b.textContent==='Create issue');
 if(publish)publish.addEventListener('click',()=>{const node=document.createElement('h2');node.dataset.testid='issue-title';node.textContent=document.querySelector('input').value;document.querySelector('main').append(node);});
</script>
