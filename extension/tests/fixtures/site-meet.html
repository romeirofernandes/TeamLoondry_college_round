<!doctype html><meta charset="utf-8"><title>Handsfree meet demo</title><style>body{font:18px system-ui;margin:24px}button,input,textarea,select{font:inherit;margin:8px;padding:12px}aside,main,app-train-search,app-train-list,[role="dialog"]{display:block;padding:16px}a,[role="row"]{display:block;margin:8px;padding:12px}[contenteditable]{min-height:80px;border:1px solid;padding:12px}</style><main><h1 data-meeting-title>Test meeting</h1><button aria-label="Turn off microphone">Mic</button><button aria-label="Turn off camera">Camera</button><button aria-label="Turn on captions">Captions</button><button aria-label="Raise hand">Hand</button><button>Join now</button><aside data-panel-id="chat"><textarea aria-label="Send a message to everyone"></textarea><button>Send</button></aside></main><script>
 window.writes=0;
 for(const row of document.querySelectorAll('#pane-side [role="row"]'))row.onclick=()=>{document.querySelector('#main header span').textContent=row.textContent;};
 for(const button of document.querySelectorAll('button[aria-pressed],button[aria-checked]'))button.onclick=()=>{const attr=button.hasAttribute('aria-pressed')?'aria-pressed':'aria-checked';const state=button.getAttribute(attr)!=='true';button.setAttribute(attr,String(state));if(button.getAttribute('aria-label')==='Save'||button.getAttribute('aria-label')==='Saved')button.setAttribute('aria-label',state?'Saved':'Save');if(button.getAttribute('role')==='radio')document.querySelector('[data-trip-index]').textContent='Walking, 4 hours';};
 for(const button of document.querySelectorAll('button')){
 const name=button.getAttribute('aria-label')||button.textContent;
 if(name==='Send')button.onclick=()=>{window.writes++;const root=button.closest('footer,[role="dialog"],[data-panel-id="chat"]');const editor=root.querySelector('textarea,[contenteditable]');const text=editor.value??editor.textContent;const message=document.createElement('div');if(location.hostname==='mail.google.com'){message.setAttribute('role','alert');message.textContent='Message sent';document.body.append(message);}else if(location.hostname==='web.whatsapp.com'){message.className='message-out';message.textContent=text;document.querySelector('#main [role="log"]').append(message);}else{message.dataset.messageId='self-'+window.writes;message.textContent=text;root.append(message);}if('value' in editor)editor.value='';else editor.textContent='';};
 if(name==='Search')button.onclick=()=>{document.querySelector('app-train-list').innerHTML='<div data-journey-summary>MAS SBC 18/11/2026</div><article data-train-number="12627">Train 12627</article>';};
 if(name==='Join now')button.onclick=()=>{button.textContent='Leave call';};
 if(name.startsWith('Turn ')||name==='Raise hand'||name==='Lower hand')button.onclick=()=>{button.setAttribute('aria-label',name.startsWith('Turn off ')?name.replace('Turn off ','Turn on '):name.startsWith('Turn on ')?name.replace('Turn on ','Turn off '):name==='Raise hand'?'Lower hand':'Raise hand');};
 if(name==='Zoom in')button.onclick=()=>document.querySelector('[data-map-zoom]').dataset.mapZoom='11';
 }
 </script>
