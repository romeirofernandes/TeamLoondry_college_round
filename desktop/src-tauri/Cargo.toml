[package]
name = "handsfree-desktop"
version = "0.2.0"
edition = "2021"
default-run = "handsfree-desktop"

[lib]
name = "handsfree_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
tauri-plugin-dialog = "2"

[profile.release]
codegen-units = 1
lto = true
strip = true
